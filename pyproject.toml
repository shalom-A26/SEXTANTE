[tool.ruff]
line-length = 100
target-version = "py312"
include = ["sextante_analysis/**/*.py", "sextante_api/**/*.py", "tests/test_analysis.py", "tests/test_stages.py", "tests/test_api.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
