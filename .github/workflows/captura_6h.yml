name: Captura periodica de vacantes (SPE + curado) a Hugging Face

on:
  schedule:
    # Cada 6 horas en hora local de Colombia (UTC-5): 05,11,17,23 UTC = 00,06,12,18 local.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:

concurrency:
  group: captura-periodica
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pull accumulated corpus from Hugging Face
        run: python -m src.extraccion.sync_hf --pull --repo pxtron/vacantes-colombia

      - name: Capture SPE (official export)
        run: python -m src.extraccion.corpus --fuentes spe

      - name: Capture curated (LinkedIn + El Empleo)
        run: python -m src.extraccion.corpus --fuentes linkedin elempleo

      - name: Emit unified dataset and upload to Hugging Face
        run: python -m src.extraccion.emitir_dataset --hf-upload --hf-repo pxtron/vacantes-colombia

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib

          import pandas as pd

          raiz = pathlib.Path.cwd()
          now = pd.Timestamp.now()
          lines = [
              "# Resumen de captura",
              f"- Fecha: {now:%Y-%m-%d %H:%M:%S}",
          ]

          spe = raiz / "data/raw/spe/vacantes_spe.parquet"
          curado = raiz / "data/raw/vacantes.csv"
          duckdb_path = raiz / "data/duckdb/sextante.duckdb"

          if spe.exists():
              n = len(pd.read_parquet(spe))
              lines.append(f"- Store SPE: {n:,} vacantes unicas")
          else:
              lines.append("- Store SPE: no generado (posible fallo de la fuente)")

          if curado.exists():
              n = len(pd.read_csv(curado, dtype=str))
              lines.append(f"- Corpus curado: {n:,} vacantes")
          else:
              lines.append("- Corpus curado: vacio")

          if duckdb_path.exists():
              import duckdb

              n = duckdb.connect(str(duckdb_path)).execute("SELECT count(*) FROM vacantes").fetchone()[0]
              lines.append(f"- Dataset unificado (DuckDB): {n:,} filas")

          print("\n".join(lines))
          PY