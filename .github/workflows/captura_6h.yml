name: Captura periodica de vacantes (SPE + curado) a Hugging Face

on:
  schedule:
    # Cada 6 horas en hora local de Colombia (UTC-5): 05,11,17,23 UTC = 00,06,12,18 local.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:

concurrency:
  group: captura-periodica
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild stores from Hugging Face
        run: python -m src.extraccion.sync_hf --pull --repo pxtron/vacantes-colombia

      - name: Capture SPE (official export)
        run: python -m src.extraccion.corpus --fuentes spe

      - name: Capture curated (LinkedIn + El Empleo)
        run: python -m src.extraccion.corpus --fuentes linkedin elempleo

      - name: Emit weekly dataset and upload to Hugging Face
        id: emitir
        run: python -m src.extraccion.emitir_dataset --hf-upload --hf-repo pxtron/vacantes-colombia

      - name: Publish run summary
        if: always()
        env:
          # Para poder decir QUÉ paso cayó: sin esto el resumen culpaba siempre
          # a la emisión, aunque la emisión nunca hubiera llegado a correr.
          STEPS: ${{ toJSON(steps) }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import pathlib

          import pandas as pd

          YO = "Publish run summary"
          EMITIR = "emitir"  # id del paso de emisión (ver el YAML)

          def pasos_caidos():
              """Pasos con conclusion de fallo, excluyendo este (aún en curso)."""
              try:
                  pasos = json.loads(os.environ.get("STEPS", "{}"))
              except json.JSONDecodeError:
                  return []
              return [
                  nombre
                  for nombre, paso in pasos.items()
                  if nombre != YO and paso.get("outcome") not in ("success", "skipped", "")
              ]

          raiz = pathlib.Path.cwd()
          lineas = [f"# Resumen de captura — {pd.Timestamp.now():%Y-%m-%d %H:%M} UTC"]

          def leer(ruta):
              if ruta.exists():
                  try:
                      return json.loads(ruta.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      pass
              return None

          base = leer(raiz / "data/raw/_publicado.json")
          estado = leer(raiz / "data/emitido/vacantes-colombia/estado.json")

          if base:
              rev = str(base.get("revision", ""))[:8]
              lineas.append(
                  f"- Restaurado desde HF: **{base.get('filas', 0):,}** vacantes "
                  f"({base.get('filas_spe', 0):,} SPE + {base.get('filas_curado', 0):,} curado, rev. {rev})"
              )
          else:
              lineas.append(
                  "- ⚠️ No se restauró corpus desde HF: puede ser la primera corrida, "
                  "un fallo de red o un token inválido. Si el repo ya tenía vacantes, "
                  "**la corrida siguiente publicará un dataset incompleto**."
              )

          if estado:
              nuevas = estado.get("filas_nuevas")
              if nuevas is None:
                  lineas.append(
                      f"- Publicado: **{estado.get('filas', 0):,}** vacantes en "
                      f"{estado.get('archivos_semanales', 0)} archivos semanales "
                      "(sin base de la corrida previa: no se puede medir el crecimiento)"
                  )
              else:
                  if nuevas > 0:
                      crecimiento = f"**+{nuevas:,}** nuevas"
                  elif nuevas == 0:
                      crecimiento = "⚠️ **sin vacantes nuevas**: la captura no aportó nada"
                  else:
                      crecimiento = (
                          f"⚠️ **{nuevas:,} menos** que las publicadas: el corpus se encogió"
                      )
                  lineas.append(f"- Publicado: **{estado.get('filas', 0):,}** vacantes — {crecimiento}")
              lineas.append(
                  f"- Semana en curso: `{estado.get('semana_en_curso')}` "
                  f"({estado.get('filas_semana_en_curso', 0):,} filas; solo este archivo se reescribe)"
              )
              lineas.append(f"- Última captura de los datos: {estado.get('captura_mas_reciente')}")
          else:
              caidos = pasos_caidos()
              if caidos:
                  where = ", ".join(f"'{n}'" for n in caidos)
                  if EMITIR in caidos:
                      lineas.append(
                          f"- ⚠️ **No se publicó el dataset**: la emisión falló en el paso {where}."
                      )
                  else:
                      lineas.append(
                          f"- ⚠️ **No se publicó el dataset**: falló el paso {where} "
                          "— no se llegó a emitir."
                      )
              else:
                  lineas.append(
                      "- ⚠️ **No se publicó el dataset**: la emisión corrió pero no dejó "
                      "`estado.json` (revisa el paso de emisión)."
                  )
              if base:
                  lineas.append(
                      f"- El corpus acumulado sigue intacto en HF "
                      f"({base.get('filas', 0):,} vacantes); la próxima corrida lo recuperará."
                  )

          print("\n".join(lineas))
          PY