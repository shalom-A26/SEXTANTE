name: Hourly job capture (JobSpy) to Hugging Face

on:
  schedule:
    # Every hour at :05 UTC = :05 Colombia time (UTC-5).
    - cron: '5 * * * *'
  workflow_dispatch:

# Same group as the SPE workflow: the two must never upload to HF at once.
concurrency:
  group: hf-upload
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore published corpus from Hugging Face
        id: pull
        run: python -m pipeline pull --dataset jobspy

      - name: Capture job boards for Colombia
        id: capture
        run: python -m pipeline capture --source jobspy --results 100

      - name: Emit and upload jobspy partitions
        id: emit
        run: python -m pipeline emit --dataset jobspy --upload

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          root = pathlib.Path.cwd()
          lines = ["# Hourly capture (JobSpy)"]

          estado_path = root / "data/emitido/vacantes-colombia/estado.json"
          if estado_path.exists():
              estado = json.loads(estado_path.read_text(encoding="utf-8"))
              nuevas = estado.get("rows_new")
              if nuevas is None:
                  growth = "no baseline (first run or pull failed)"
              elif nuevas > 0:
                  growth = f"**+{nuevas:,} new**"
              else:
                  growth = "⚠️ **no new vacancies** — capture returned nothing fresh"
              lines.append(f"- Rows: **{estado.get('rows', 0):,}** ({growth})")
              lines.append(f"- Files: {estado.get('files', 0)}")
              lines.append(f"- Latest capture: {estado.get('latest_capture')}")
          else:
              lines.append("⚠️ No `estado.json`: emission did not run (check the failed step above).")
          print("\n".join(lines))
          PY
