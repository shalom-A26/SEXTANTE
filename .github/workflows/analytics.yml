name: Analytics run (daily) to Hugging Face

# Runs every analytics stage (2-6) on one pinned corpus revision and
# publishes derived/runs/<id>/ + derived/latest.json, then redeploys the API
# on Render so the dashboard serves the new run. Daily at 06:00 UTC (01:00
# Colombia), after the 04:23 UTC SPE capture; once a day on purpose: every
# published run adds ~0.5 GB to the dataset's git history, and SPE barely
# changes within a day. A full run takes ~46 min and ~11-12 GB of the 16 GB
# runner (see the step summary).
#
# ESCO v1.2.1 Spanish skills CSV (not in Git) comes from the GitHub release
# `taxonomy-esco-v1.2.1` by default, verified by SHA-256; `esco_source: hf`
# reads it from the HF dataset at `esco_path` instead.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      esco_source:
        description: "Where to read the ESCO skills CSV from"
        type: choice
        options: [release, hf]
        default: release
      esco_path:
        description: "Path of the ESCO skills CSV inside the HF dataset (esco_source=hf)"
        default: "taxonomy/esco-v1.2.1/skills_es.csv"
      limit:
        description: "Rows per dataset (empty = full corpus)"
        default: ""
      clusters:
        description: "K-Means segments"
        default: "16"
      upload:
        description: "Publish to derived/ on Hugging Face"
        type: boolean
        default: true

# Same group as the capture workflows: never upload to HF concurrently.
concurrency:
  group: hf-upload
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Scheduled runs have no inputs: fall back to the dispatch defaults.
      ESCO_PATH: ${{ inputs.esco_path || 'taxonomy/esco-v1.2.1/skills_es.csv' }}
      CLUSTERS: ${{ inputs.clusters || '16' }}
      LIMIT: ${{ inputs.limit }}
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
      ESCO_SHA256: 30b1271fca7348a01ace7f33619ff6fc00fc3bb645a4dbdfa8fae6d57789f4a4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements/analysis.txt
          python -m pip install --no-deps -e ./backend

      - name: Download the ESCO taxonomy from the GitHub release
        if: inputs.esco_source != 'hf'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download taxonomy-esco-v1.2.1 --pattern skills_es.csv --repo "$GITHUB_REPOSITORY"
          echo "${ESCO_SHA256}  skills_es.csv" | sha256sum --check

      - name: Download the ESCO taxonomy from the dataset
        if: inputs.esco_source == 'hf'
        run: |
          python - <<'PY'
          import os
          import shutil
          from huggingface_hub import hf_hub_download

          path = hf_hub_download("pxtron/vacantes-colombia", os.environ["ESCO_PATH"],
                                 repo_type="dataset", token=os.environ["HF_TOKEN"])
          shutil.copy(path, "skills_es.csv")
          PY

      - name: Run analytics
        run: |
          args=(--esco-csv skills_es.csv --clusters "$CLUSTERS")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ "$UPLOAD" = "true" ]; then args+=(--upload); fi
          /usr/bin/time -v -o time.txt python -m sextante.analytics run "${args[@]}"

      # The API loads derived/latest.json at startup: redeploying it on Render
      # is what puts the new run on the dashboard.
      - name: Redeploy the API on Render
        if: success() && env.UPLOAD == 'true' && env.LIMIT == ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; the API keeps serving the previous run until it restarts."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render redeploy triggered."

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import re

          lines = ["# Analytics run"]
          timing = pathlib.Path("time.txt")
          if timing.exists():
              text = timing.read_text()
              wall = re.search(r"Elapsed \(wall clock\) time.*: (.+)", text)
              rss = re.search(r"Maximum resident set size \(kbytes\): (\d+)", text)
              lines.append(f"- Wall time: {wall.group(1) if wall else '?'}")
              if rss:
                  lines.append(f"- Peak memory: {int(rss.group(1)) / 1024 / 1024:.2f} GB")
          runs = sorted(pathlib.Path("data/analysis/runs").glob("*/manifest.json"))
          if runs:
              results = json.loads(runs[-1].read_text())["results"]
              lines.append(f"- Run: `{runs[-1].parent.name}`")
              lines.append("```json")
              lines.append(json.dumps(results, indent=1, ensure_ascii=False)[:6000])
              lines.append("```")
          else:
              lines.append("⚠️ No manifest: the run failed (see the step above).")
          print("\n".join(lines))
          PY

      - name: Keep the run as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-run
          path: |
            data/analysis/runs/*/manifest.json
            data/analysis/runs/*/*.json
            data/analysis/runs/*/*.csv
            time.txt
          retention-days: 30
