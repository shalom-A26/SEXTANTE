name: Analytics run (manual) to Hugging Face

# Runs every analytics stage (2-6) on one pinned corpus revision and
# publishes derived/runs/<id>/ + derived/latest.json. Manual on purpose:
# measure duration and memory (see the step summary) before scheduling it.
#
# Prerequisite: the official ESCO v1.2.1 Spanish skills CSV uploaded once to
# the dataset at the path given by `esco_path` (it is not in Git).
on:
  workflow_dispatch:
    inputs:
      esco_path:
        description: "Path of the ESCO skills CSV inside the HF dataset"
        default: "taxonomy/esco-v1.2.1/skills_es.csv"
      limit:
        description: "Rows per dataset (empty = full corpus)"
        default: ""
      clusters:
        description: "K-Means segments"
        default: "8"
      upload:
        description: "Publish to derived/ on Hugging Face"
        type: boolean
        default: true

# Same group as the capture workflows: never upload to HF concurrently.
concurrency:
  group: hf-upload
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ESCO_PATH: ${{ inputs.esco_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-analysis.txt

      - name: Download the ESCO taxonomy from the dataset
        run: |
          python - <<'PY'
          import os
          import shutil
          from huggingface_hub import hf_hub_download

          path = hf_hub_download("pxtron/vacantes-colombia", os.environ["ESCO_PATH"],
                                 repo_type="dataset", token=os.environ["HF_TOKEN"])
          shutil.copy(path, "skills_es.csv")
          PY

      - name: Run analytics
        run: |
          args=(--esco-csv skills_es.csv --clusters "${{ inputs.clusters }}")
          if [ -n "${{ inputs.limit }}" ]; then args+=(--limit "${{ inputs.limit }}"); fi
          if [ "${{ inputs.upload }}" = "true" ]; then args+=(--upload); fi
          /usr/bin/time -v -o time.txt python -m sextante_analysis run "${args[@]}"

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import re

          lines = ["# Analytics run"]
          timing = pathlib.Path("time.txt")
          if timing.exists():
              text = timing.read_text()
              wall = re.search(r"Elapsed \(wall clock\) time.*: (.+)", text)
              rss = re.search(r"Maximum resident set size \(kbytes\): (\d+)", text)
              lines.append(f"- Wall time: {wall.group(1) if wall else '?'}")
              if rss:
                  lines.append(f"- Peak memory: {int(rss.group(1)) / 1024 / 1024:.2f} GB")
          runs = sorted(pathlib.Path("data/analysis/runs").glob("*/manifest.json"))
          if runs:
              results = json.loads(runs[-1].read_text())["results"]
              lines.append(f"- Run: `{runs[-1].parent.name}`")
              lines.append("```json")
              lines.append(json.dumps(results, indent=1, ensure_ascii=False)[:6000])
              lines.append("```")
          else:
              lines.append("⚠️ No manifest: the run failed (see the step above).")
          print("\n".join(lines))
          PY

      - name: Keep the run as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-run
          path: |
            data/analysis/runs/*/manifest.json
            data/analysis/runs/*/*.json
            time.txt
          retention-days: 30
