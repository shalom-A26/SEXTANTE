name: SPE capture (every 12h) to Hugging Face

on:
  schedule:
    # 04:23 and 16:23 UTC = 23:23 and 11:23 Colombia time (UTC-5).
    # The SPE export is a ~415 MB official snapshot that barely changes
    # hour to hour, so twice a day is enough. The :23 minute is off-peak:
    # GitHub delays or drops scheduled runs at high-load minutes like :00,
    # which delayed the original 04:00 cron by hours.
    - cron: '23 4,16 * * *'
  workflow_dispatch:

# Same group as the 30-min JobSpy workflow: never upload to HF concurrently.
concurrency:
  group: hf-upload
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore published corpus from Hugging Face
        id: pull
        run: python -m pipeline pull --dataset spe

      - name: Capture the official SPE export
        id: capture
        run: python -m pipeline capture --source spe

      - name: Emit and upload SPE partitions
        id: emit
        run: python -m pipeline emit --dataset spe --upload

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          root = pathlib.Path.cwd()
          lines = ["# SPE capture (every 12h)"]

          estado_path = root / "data/emitido/vacantes-colombia/estado.json"
          if estado_path.exists():
              estado = json.loads(estado_path.read_text(encoding="utf-8"))
              nuevas = estado.get("rows_new")
              if nuevas is None:
                  growth = "no baseline (first run or pull failed)"
              elif nuevas > 0:
                  growth = f"**+{nuevas:,} new**"
              elif nuevas == 0:
                  growth = "⚠️ **no new vacancies**"
              else:
                  growth = f"⚠️ **{nuevas:,} fewer** than published"
              lines.append(f"- Rows: **{estado.get('rows', 0):,}** ({growth})")
              lines.append(f"- Week files: {estado.get('files', 0)}")
              lines.append(f"- Latest capture: {estado.get('latest_capture')}")
          else:
              lines.append("⚠️ No `estado.json`: emission did not run (check the failed step above).")
          print("\n".join(lines))
          PY
